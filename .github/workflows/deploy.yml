name: Deploy Firebase Functions
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g firebase-tools
      - run: cd functions && npm install && cd .. && firebase deploy --only functions --token "${{ secrets.FIREBASE_TOKEN }}"
